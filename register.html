<!DOCTYPE html>
<html>
<head>
    <title>Register | SCDMP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="center">Citizen Registration</h2>

<form class="box" id="registerForm" onsubmit="handleRegistration(event)">
    <label>Full Name</label>
    <input type="text" id="fullName" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Mobile Number</label>
    <div style="display: flex; gap: 10px;">
        <span style="display: flex; align-items: center; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">+91</span>
        <input type="tel" id="mobile" placeholder="Enter 10-digit number" maxlength="10" pattern="[0-9]{10}" required style="flex: 1;">
    </div>

    <label>Password</label>
    <input type="password" id="password" required>

    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" required>

    <button type="submit" class="btn">Create Account</button>
</form>

<p class="note">Passwords are securely protected using SHA-256 hashing.</p>

<script>
function handleRegistration(event) {
    event.preventDefault();

    const fullName = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const mobile = document.getElementById('mobile').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Validate passwords match
    if (password !== confirmPassword) {
        alert('Passwords do not match!');
        return;
    }

    // Validate all fields are filled
    if (!fullName || !email || !mobile || !password) {
        alert('Please fill in all fields');
        return;
    }

    // Show success message
    alert('You are registered successfully!\n\nNow login with your credentials.');
    
    // Redirect to login page
    window.location.href = 'login.html';
}
</script>

</body>
</html>
