<!DOCTYPE html>
<html>
<head>
    <title>Upload Document | SCDMP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="center">Upload Document</h2>

<form class="box">
    <label>Document Type</label>
    <select>
        <option>Aadhaar</option>
        <option>PAN</option>
        <option>Income Certificate</option>
        <option>Birth Certificate</option>
        <option>Passport</option>
        <option>Driving License</option>
        <option>Death Certificate</option>
        <option>Voter Id</option>
        <option>Insurance</option>
        <option>Residential Proof</option>
        <option>Others</option>
    </select>

    <label>Select File</label>
    <input type="file">

    <button class="btn">Upload Securely</button>
</form>

<p class="note">Documents are encrypted using AES-256 before storage.</p>

</body>
</html>
